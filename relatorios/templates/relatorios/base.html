{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal OVS - Óticas Vida</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --azul-escuro: #004a8d;
            --azul-claro: #e0f2f1;
            --azul-destaque: #00b4d8;
            --branco: #ffffff;
            --cinza-fundo: #f4f7f6;
            --texto: #333333;
        }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--cinza-fundo); display: flex; color: var(--texto); overflow-x: hidden; }

        /* MENU LATERAL */
        .sidebar { width: 75px; background-color: var(--branco); height: 100vh; position: fixed; box-shadow: 2px 0 15px rgba(0,0,0,0.08); display: flex; flex-direction: column; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow-x: hidden; white-space: nowrap; z-index: 100; }
        .sidebar:hover { width: 260px; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        .logo-icon { font-size: 24px; color: var(--azul-escuro); min-width: 35px; text-align: center; }
        .logo-text { font-weight: 800; font-size: 18px; color: var(--azul-escuro); letter-spacing: -0.5px; }

        .menu-items { flex-grow: 1; padding: 10px 0; }
        .menu-item { position: relative; }
        .menu-toggle, .menu-item > a { width: 100%; padding: 12px 20px; display: flex; align-items: center; gap: 15px; border: none; background: none; color: #666; cursor: pointer; text-align: left; text-decoration: none; font-size: 15px; transition: all 0.2s; }
        .menu-toggle i:first-child, .menu-item > a i { min-width: 35px; font-size: 18px; text-align: center; }
        .menu-toggle:hover, .menu-item > a:hover { background-color: var(--azul-claro); color: var(--azul-escuro); }
        .arrow { margin-left: auto; font-size: 12px; transition: transform 0.3s; }
        
        .submenu { display: none; background-color: #f9f9f9; padding: 5px 0; }
        .submenu a { padding: 10px 20px 10px 55px; display: flex; align-items: center; gap: 10px; color: #777; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .submenu a:hover { color: var(--azul-escuro); background-color: #f0f0f0; }
        .submenu a i { font-size: 8px; }

        .menu-item.active .submenu { display: block; }
        .menu-item.active .arrow { transform: rotate(90deg); }

        /* ÁREA DO USUÁRIO */
        .user-area { border-top: 1px solid #eee; padding: 15px 10px; margin-top: auto; }
        .user-details { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; }
        .user-details p { margin: 0; font-size: 13px; color: #888; }
        .btn-sair-icon { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; border: none; background-color: #fee2e2; color: #dc2626; cursor: pointer; transition: 0.2s; }
        .btn-sair-icon:hover { background-color: #fecaca; }

        /* CONTEÚDO PRINCIPAL */
        .main-content { margin-left: 75px; flex-grow: 1; padding: 30px; transition: margin-left 0.3s; }
        .card { background-color: var(--branco); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 25px; min-height: 80vh; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-eye logo-icon"></i>
            <span class="logo-text">PORTAL OVS</span>
        </div>

        <div class="menu-items">
            <div class="menu-item">
                <a href="{% url 'dashboard' %}"><i class="fas fa-home"></i> <span>Início</span></a>
            </div>

            <div class="menu-item">
                <button class="menu-toggle">
                    <i class="fas fa-chart-line"></i> 
                    <span>Relatórios Vendas</span> 
                    <i class="fas fa-chevron-right arrow"></i>
                </button>
                <div class="submenu">
                    <a href="{% url 'relatorio_vendas' %}">
                        <i class="fas fa-circle"></i> Meta Vendedores
                    </a>
                    <a href="{% url 'vendas_marca' %}">
                        <i class="fas fa-circle"></i> Vendas por Marca
                    </a>
                </div>
            </div>

            <div class="menu-item">
                <button class="menu-toggle"><i class="fas fa-file-invoice-dollar"></i> <span>Financeiro</span> <i class="fas fa-chevron-right arrow"></i></button>
                <div class="submenu">
                    <a href="{% url 'relatorio_duplicidade_nf' %}"><i class="fas fa-circle"></i> Duplicidade de NF</a>
                </div>
            </div>

            {% if user.is_staff %}
            <div class="menu-item">
                <button class="menu-toggle"><i class="fas fa-user-shield"></i> <span>Administração</span> <i class="fas fa-chevron-right arrow"></i></button>
                <div class="submenu">
                    <a href="{% url 'admin:index' %}"><i class="fas fa-circle"></i> Painel Django</a>
                </div>
            </div>
            {% endif %}
        </div>

        <div class="user-area">
            <form action="{% url 'logout' %}" method="post" style="display: flex; align-items: center; gap: 10px;">
                {% csrf_token %}
                <button type="submit" class="btn-sair-icon" title="Sair do Sistema">
                    <i class="fas fa-power-off"></i>
                </button>
                <div class="user-details">
                    <p>Olá, <strong>{{ user.username }}</strong></p>
                </div>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <script>
        // Lógica para abrir/fechar submenus
        document.querySelectorAll('.menu-toggle').forEach(button => {
            button.addEventListener('click', function() {
                let parentItem = this.parentElement;
                if(parentItem.classList.contains('active')){
                    parentItem.classList.remove('active');
                } else {
                    document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
                    parentItem.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
