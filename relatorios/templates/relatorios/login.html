{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso - Portal OVS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #e0f2f1 0%, #094ba8 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        
        .logo-container { margin-bottom: 25px; }
        .logo-login { max-width: 240px; display: block; margin: 0 auto; }
        
        /* Estilo para o texto "Relatórios" abaixo da logo */
        .logo-subtitle { 
            display: block; 
            font-size: 18px; 
            color: #004a8d; 
            font-weight: 300; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            margin-top: -5px; /* Puxa o texto um pouco para cima para ficar mais próximo da logo */
        }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: #0a3fa8; box-shadow: 0 0 5px rgba(0, 180, 216, 0.3); }
        .btn-login { width: 100%; background: #004a8d; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-login:hover { background: #003366; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="login-box">
        
        <div class="logo-container">
            <img src="{% static 'relatorios/img/logo.webp' %}" alt="Logo Óticas Vida" class="logo-login">
            <span class="logo-subtitle">Relatórios</span>
        </div>
        
        {% if form.errors %}
            <div style="color: #dc3545; margin-bottom: 15px; font-size: 14px; background: #ffe6e6; padding: 10px; border-radius: 5px;">
                <i class="fas fa-exclamation-circle"></i> Credenciais inválidas.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" name="username" autofocus required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>
</body>
</html>
